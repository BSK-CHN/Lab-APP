name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Verify required secrets
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then echo "DOCKERHUB_USERNAME is missing"; exit 1; fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then echo "DOCKERHUB_TOKEN is missing"; exit 1; fi
          export DOCKERHUB_USERNAME_LOWER=$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
          echo "DOCKERHUB_USERNAME_LOWER=$DOCKERHUB_USERNAME_LOWER" >> "$GITHUB_ENV"
          if [ -z "$DEPLOY_REPO_TOKEN" ]; then
            echo "DEPLOY_REPO_TOKEN is missing; continuing with image build only"
          fi

      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_USERNAME_LOWER }}/lab-app:${{ env.IMAGE_TAG }}
            docker.io/${{ env.DOCKERHUB_USERNAME_LOWER }}/lab-app:latest

      - name: Update deployment repo manifests
        if: ${{ env.DEPLOY_REPO_TOKEN != '' }}
        run: |
          git clone https://x-access-token:${DEPLOY_REPO_TOKEN}@github.com/${{ github.repository_owner }}/Lab-Deploy.git deploy-repo
          cd deploy-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          path = Path('k8s/deployment.yaml')
          text = path.read_text()
          new_image = f"docker.io/{os.environ['DOCKERHUB_USERNAME_LOWER']}/lab-app:{os.environ['IMAGE_TAG']}"
          # Replace any existing lab-app image reference (handles any tag or username variant)
          pattern = r'image:\s* docker\.io/[^/]+/lab-app:[^\s]+'
          if not re.search(pattern, text):
              # Fallback: try matching plain lab-app image without docker.io prefix
              pattern = r'image:\s* lab-app:[^\s]+'
          text = re.sub(pattern, f'image: {new_image}', text)
          path.write_text(text)
          PY
          git add k8s/deployment.yaml
          if git diff --cached --quiet; then
            echo "No manifest change needed"
          else
            git commit -m "Deploy image $IMAGE_TAG"
            git push origin main
          fi
