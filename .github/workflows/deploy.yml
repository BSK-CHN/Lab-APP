name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
      IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lab-app
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Verify required secrets
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then echo "DOCKERHUB_USERNAME is missing"; exit 1; fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then echo "DOCKERHUB_TOKEN is missing"; exit 1; fi
          if [ -z "$DEPLOY_REPO_TOKEN" ]; then echo "DEPLOY_REPO_TOKEN is missing"; exit 1; fi

      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update deployment repo manifests
        run: |
          git clone https://x-access-token:${DEPLOY_REPO_TOKEN}@github.com/${{ github.repository_owner }}/Lab-Deploy.git deploy-repo
          cd deploy-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          import os
          path = Path('k8s/deployment.yaml')
          text = path.read_text()
          new_image = f"docker.io/{os.environ['DOCKERHUB_USERNAME']}/lab-app:{os.environ['IMAGE_TAG']}"
          text = text.replace('image: docker.io/REPLACE_ME/lab-app:latest', f'image: {new_image}')
          path.write_text(text)
          PY
          git add k8s/deployment.yaml
          if git diff --cached --quiet; then
            echo "No manifest change needed"
          else
            git commit -m "Deploy image $IMAGE_TAG"
            git push origin main
          fi
